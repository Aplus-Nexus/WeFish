[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wefish"
version = "0.1.0"
description = "Cross-platform WeRead desktop reader"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.7,<7",
    "pynput>=1.7.7",
    "pyobjc-core<10; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-Cocoa<10; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-Quartz<10; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-ApplicationServices<10; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-CoreText<10; sys_platform == 'darwin' and python_version < '3.10'",
    "qrcode>=7.4,<9",
    "Pillow>=9.1",
    "keyring>=25.0",
]

[project.scripts]
wefish = "app:main"
