name: WeFish desktop builds

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release versions agree
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          package = json.loads(Path("desktop/package.json").read_text())
          lock = json.loads(Path("desktop/package-lock.json").read_text())
          manifest = json.loads(Path("integrations/edge/manifest.json").read_text())
          versions = {
              "desktop/package.json": package["version"],
              "desktop/package-lock.json": lock["version"],
              "desktop/package-lock.json packages root": lock["packages"][""]["version"],
              "integrations/edge/manifest.json": manifest["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"release versions disagree: {versions}")

          version = package["version"]
          changelog = Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## {re.escape(version)}\b", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md has no {version} release notes")

          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v") and ref != f"v{version}":
              raise SystemExit(f"tag {ref} does not match application version v{version}")
          print(f"release version verified: v{version}")
          PY

  edge-extension:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Edge extension
        run: |
          node --check integrations/edge/background.js
          node --check integrations/edge/popup.js
          node --check integrations/edge/sidepanel.js
          node --check integrations/edge/overlay.js
          python -c "import json; json.load(open('integrations/edge/manifest.json'))"
      - name: Package Edge extension
        run: zip -r "WeFish-Edge-Extension-${GITHUB_REF_NAME}.zip" integrations/edge
      - uses: actions/upload-artifact@v4
        with:
          name: WeFish-edge-extension
          path: WeFish-Edge-Extension-*.zip
      - name: Publish Edge extension asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WeFish-Edge-Extension-*.zip
          generate_release_notes: true
  package:
    needs: verify-version
    strategy:
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the local WeRead service
        run: python -m PyInstaller --noconfirm --clean WeFishService.spec
      - name: Install and package Electron desktop shell
        shell: bash
        run: |
          cd desktop
          npm ci
          if [ "${{ matrix.target }}" = "mac" ]; then
            npm run package:mac
            npm run smoke:package
          else
            npm run package:win:zip
            npm run smoke:package
          fi
      - name: Verify packaged archive
        run: python -c "from pathlib import Path; from zipfile import ZipFile; paths=list(Path('desktop/release').glob('*.zip')); assert paths; assert all(ZipFile(p).testzip() is None for p in paths)"
      - uses: actions/upload-artifact@v4
        with:
          name: WeFish-${{ matrix.target }}
          path: |
            desktop/release/*.zip
            desktop/release/*.dmg
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.zip
            desktop/release/*.dmg
          generate_release_notes: true
